<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Thermal Wave Gradient -->
    <linearGradient id="thermalWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Moon Gradient -->
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="126" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Ambient Glow Behind Moon -->
  <circle cx="256" cy="230" r="140" fill="#6366F1" opacity="0.25" filter="url(#glow)" />

  <!-- Stylized Crescent Moon -->
  <path
    d="M 320 150 C 310 150, 240 180, 240 270 C 240 350, 310 380, 330 380 C 210 395, 145 295, 160 215 C 172 150, 245 130, 320 150 Z"
    fill="url(#moonGrad)"
    filter="url(#glow)"
  />

  <!-- Circadian Thermal Flow Wave -->
  <path
    d="M 80 370 C 160 330, 210 430, 300 370 C 370 320, 410 380, 440 350"
    stroke="url(#thermalWave)"
    stroke-width="20"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow)"
  />

  <!-- Thermal Particles (Cool to Warm) -->
  <circle cx="120" cy="355" r="8" fill="#06B6D4" filter="url(#glow)" />
  <circle cx="280" cy="385" r="9" fill="#818CF8" filter="url(#glow)" />
  <circle cx="430" cy="352" r="10" fill="#F59E0B" filter="url(#glow)" />

  <!-- Hugo's Pod Star Sparkle -->
  <path
    d="M 370 120 Q 370 145 395 145 Q 370 145 370 170 Q 370 145 345 145 Q 370 145 370 120 Z"
    fill="#F59E0B"
  />
  <path
    d="M 170 130 Q 170 142 182 142 Q 170 142 170 154 Q 170 142 158 142 Q 170 142 170 130 Z"
    fill="#06B6D4"
  />
</svg>
